<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="{% block meta_description %}{{ config.APP_NAME }}{% endblock %}"
        />
        <title>{% block title %}{{ config.APP_NAME }}{% endblock %}</title>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
        <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}" />
    </head>
{% block header %}{% include 'structure/header.html' %}{% endblock %}

<!-- Основная часть страницы: контейнер стилизуется классом site-main -->
<main class="site-main">
{% block content %}
{% endblock %}
</main>

<script type="text/javascript" src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block footer %}{% include 'structure/footer.html' %}{% endblock %}
