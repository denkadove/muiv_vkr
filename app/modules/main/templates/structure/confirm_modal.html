<!-- Модальное окно подтверждения опасных действий: открывается js/main.js для форм js-confirm -->
<div class="modal-overlay" id="confirm-modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title" aria-describedby="confirm-modal-text">
        <h3 class="modal-title" id="confirm-modal-title">Подтвердите действие</h3>
        <p class="modal-text" id="confirm-modal-text"></p>
        <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="confirm-modal-cancel">Отмена</button>
            <button type="button" class="btn btn-danger" id="confirm-modal-submit">Подтвердить</button>
        </div>
    </div>
</div>
