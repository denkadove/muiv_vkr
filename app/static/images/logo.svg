<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Логотип: коробка товара на маркетплейсе">
    <!-- Верхняя грань изометрической коробки (светлый оттенок акцента) -->
    <polygon points="16,3 27,9 16,15 5,9" fill="#4d8ce0"/>
    <!-- Левая грань (фирменный синий) -->
    <polygon points="5,9 16,15 16,29 5,23" fill="#1764c7"/>
    <!-- Правая грань (затемнённый акцент) -->
    <polygon points="27,9 16,15 16,29 27,23" fill="#1152a5"/>
    <!-- Полоса скотча на верхней грани -->
    <polygon points="15,3.6 17,3.6 17,14.4 15,14.4" fill="#e9f0fb"/>
    <!-- Ярлык-этикетка на левой грани -->
    <polygon points="8,12.5 12,14.5 12,19.5 8,17.5" fill="#e9f0fb" opacity="0.85"/>
</svg>
